<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#1C1915;--surface:#26221D;--ink:#F0E9DF;--muted:#A99E92;--line:#3B342D;--soft:#2F2A24;
  --clay:#E88C61;--clay-d:#B9653D;--on-clay:#24170F;--crab:#EE7A5D;--crab-d:#C0553B;--blush:#E89A92;
  --ok:#6CC28C;--bad:#EF7B6F;--gold:#F2C35B;--sky:#8DB4E6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}

.fun{font-family:var(--fun);font-weight:400}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.app{max-width:1080px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--fun);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1}
.brand h1 em{font-style:normal;color:var(--clay)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{display:flex;align-items:baseline;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--fun);font-weight:400;font-size:17px;color:var(--ink)}
.stat .g{color:var(--gold)}
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:18px;line-height:1}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon:disabled{opacity:.35}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;align-items:center;gap:6px}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:16px;padding:10px 14px;font-family:var(--fun);font-size:16px;line-height:1.4;text-align:center;min-height:48px;max-width:220px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--surface);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.buddy{width:170px;max-width:100%}
.crab{display:block;width:100%;height:auto;overflow:visible}
.crab .b{fill:var(--crab)}
.crab .d{stroke:var(--crab-d);stroke-width:5;stroke-linecap:round;fill:none}
.crab .bl{fill:var(--blush);opacity:.75}
.crab .ew{fill:#FFFFFF;stroke:var(--crab-d);stroke-width:2}
.crab .ep{fill:#2B2420}
.crab .m{stroke:#5A2416;stroke-width:3;fill:none;stroke-linecap:round}
.crab .shine{fill:#FFFFFF;opacity:.35}
.crab .jaw{transform-box:fill-box;transform-origin:15% 90%}
.crab .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.buddy .crab{animation:bob 2.6s ease-in-out infinite}
.buddy.happy .crab{animation:hop .55s ease-out}
.buddy.sad .crab{animation:shake .5s ease-in-out}
.buddy.dance .crab,.crab-big.dance .crab{animation:dance .7s ease-in-out infinite}
.buddy.happy .jaw,.buddy.dance .jaw,.crab-big.dance .jaw{animation:snap .35s ease-in-out 3}
.crab-big.sad .crab{animation:droop 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

main{min-width:0;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

.stars3 .s{font-size:46px;line-height:1;color:var(--line);transform:scale(.3);opacity:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(.35s + var(--d))}
.stars3 .s.on{color:var(--gold)}
.stars3 .s:nth-child(2){font-size:58px;margin-top:-10px}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(30px) scale(.9);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  aside{position:static;flex-direction:row;justify-content:flex-start;gap:12px}
  .buddy{width:84px;flex:none}
  .bubble{flex:1;max-width:none;text-align:left;font-size:15px}
  .bubble::after{left:-9px;bottom:auto;top:50%;transform:translateY(-50%) rotate(135deg)}
}
@media (max-width:480px){.opts{grid-template-columns:minmax(0,1fr)}.wcard{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stars3 .s{transform:none;opacity:1}}

{type:"作文",exam:"2026年6月 第一套",title:"大学生是否必须参加科研项目",
ask:"有高校提议每位大学生毕业前至少参加一个科研项目。请从必要性和可行性两方面谈谈你对这一提议的看法。",
steps:["先判断文体：这是「表态型」议论文，题目已经给出两个角度：必要性和可行性。文章主体就按这两个角度分两段，阅卷老师一眼就能看到你扣题了。","选立场：完全赞成或完全反对都容易写得片面。更好写、也更有说服力的是折中立场：科研有价值，但不应一刀切地强制。","第二段写必要性：科研能培养什么能力，对谁特别有帮助。每个观点后面跟一句解释，不要只罗列。","第三段写可行性问题：师资和经费够不够，所有专业、所有学生是否都适合，强制会不会流于形式。","结尾不要只重复观点，给出一个可操作的替代方案，文章会显得更成熟。"],
paras:[["Recently, some universities have proposed that every student should take part in at least one research project before graduation. In my view, the idea is valuable, but making it compulsory for everyone may not be the best choice.","最近，一些高校提议每位学生在毕业前至少参加一个科研项目。在我看来，这个想法很有价值，但要求每个人都必须参加，未必是最好的选择。"],
["On the one hand, research experience is clearly necessary for college students. It trains us to ask questions, collect evidence and solve problems on our own, skills that classroom learning alone can hardly provide. For those who plan to go to graduate school, it also lays a solid foundation.","一方面，科研经历对大学生显然是必要的。它训练我们提出问题、收集证据、独立解决问题，而这些能力仅靠课堂学习很难获得。对打算读研的学生来说，它还能打下坚实的基础。"],
["On the other hand, the plan faces practical difficulties. Universities may not have enough teachers and funds to guide every student. Besides, not all majors and students are suited to research, and forced participation may turn into a mere formality.","另一方面，这个计划在实际操作中面临困难。高校可能没有足够的老师和经费来指导每一位学生。此外，并不是所有专业、所有学生都适合做科研，强制参与可能会流于形式。"],
["Therefore, I suggest that universities encourage rather than require research. They could offer flexible options, such as short research tasks in courses, so that every student can benefit in a way that suits them.","因此，我建议高校鼓励而不是强制学生做科研。学校可以提供灵活的选择，比如在课程中布置简短的研究任务，让每个学生都能以适合自己的方式受益。"]],
tips:[["make it compulsory for everyone","要求每个人都必须……"],["lay a solid foundation","打下坚实的基础"],["turn into a mere formality","流于形式"],["encourage rather than require","鼓励而非强制"],["On the one hand… On the other hand…","一方面……另一方面……，正好对应两个论证角度"]]},

{type:"作文",exam:"2026年6月 第三套",title:"如何让校园生活更便利",
ask:"以学生身份给学校写一篇建议，说明怎样让校园生活更便利，可以从线上服务、基础设施、场馆开放时间等方面提出具体措施。",
steps:["文体是「建议信 / 建议文」，开头一句交代身份和写作目的：我是谁、我想提什么建议。","题目给了三个方向，直接用作三个主体段，每段结构都是「建议 + 现状问题 + 改进后的好处」。","建议要具体。写 more water dispensers in teaching buildings，比写 improve facilities 有画面感，也更容易拿高分。","段落之间用 First / In addition / Last but not least 连接，层次清楚。","结尾表达希望学校采纳，语气礼貌。"],
paras:[["As a student who has lived on campus for two years, I would like to offer some suggestions on how to make campus life more convenient.","作为一名在校园里生活了两年的学生，我想就如何让校园生活更便利提几点建议。"],
["First, the university could combine its various online services into one app. At present, we have to switch between different websites to book study rooms, pay fees and check grades, which wastes a lot of time. A single platform would make these tasks much easier.","首先，学校可以把各种线上服务整合到一个 App 里。目前，我们预约自习室、缴费、查成绩都要在不同网站之间来回切换，浪费了很多时间。一个统一的平台会让这些事情简单得多。"],
["In addition, some basic facilities need to be improved. For example, more charging points for electric bikes and more water dispensers in teaching buildings would meet students' daily needs.","此外，一些基础设施需要改善。比如，增加电动车充电桩和教学楼里的饮水机，就能满足学生的日常需求。"],
["Last but not least, the library and the gym could stay open later. Many students are busy with classes during the day, and longer opening hours would allow them to study or exercise in the evening.","最后，图书馆和体育馆可以晚一点关门。很多学生白天忙于上课，延长开放时间能让他们晚上也可以学习或锻炼。"],
["I believe these changes would greatly improve our campus life, and I hope the university will consider them.","我相信这些改变会大大改善我们的校园生活，希望学校能够考虑。"]],
tips:[["I would like to offer some suggestions on…","我想就……提几点建议，建议类万能开头"],["combine A into B","把 A 整合成 B"],["switch between different websites","在不同网站之间切换"],["meet students' daily needs","满足学生的日常需求"],["Last but not least","最后但同样重要的是"]]},

{type:"作文",exam:"2025年12月",title:"给学生会的建议：丰富课余生活",
ask:"学生会正在征集意见，希望明年的工作能更好地丰富同学们的课余生活。请写一篇文章回应，提出你的建议。",
steps:["这是「回应征集」类建议文，第一句要回应对方：我很高兴看到学生会在征集意见。","想建议时从学生的真实需求出发：交朋友、减压、为就业做准备。三条建议覆盖兴趣、心理、发展三个层面，内容不会重复。","每条建议后写一句「为什么这样做有用」，比单纯列活动名称更有说服力。","可以用比较来加深论证，例如小组活动和大型活动比，更容易交到朋友。","结尾回扣题目中的 next year，表达期待。"],
paras:[["I am glad to learn that the Student Union is collecting ideas for its work next year. Here are my suggestions on how to make our after-class life more colorful.","得知学生会正在为明年的工作征集意见，我很高兴。下面是我关于如何让课余生活更丰富多彩的建议。"],
["To begin with, the Student Union could organize more small-group activities, such as reading clubs and hands-on workshops. Compared with large events, these activities allow students to make friends and share ideas more easily.","首先，学生会可以多组织一些小组活动，比如读书会和动手实践的工作坊。和大型活动相比，这类活动能让同学们更容易交朋友、交流想法。"],
["What's more, more attention should be paid to students' mental health. Outdoor activities and stress-relief sessions during exam weeks would help students relax and stay positive.","其次，应当更加关注学生的心理健康。在考试周开展户外活动和减压活动，能帮助同学们放松心情、保持积极。"],
["Finally, it would be helpful to invite graduates and companies to campus. Career talks and skills training, such as public speaking and data analysis, can prepare us for the job market.","最后，邀请校友和企业来学校会很有帮助。职业讲座和公开演讲、数据分析等技能培训，能帮我们为就业做好准备。"],
["I hope these suggestions will be useful, and I look forward to an even richer student life next year.","希望这些建议能有所帮助，期待明年的校园生活更加丰富。"]],
tips:[["make our after-class life more colorful","让课余生活更丰富多彩"],["Compared with large events, …","和大型活动相比……，用对比加强论证"],["more attention should be paid to…","应该更加关注……，被动句显得正式"],["prepare us for the job market","帮我们为就业做准备"],["I look forward to…","我期待……，to 是介词，后面接名词或动名词"]]},

{type:"作文",exam:"2025年6月 第二套",title:"学习中如何正确使用 AI 工具",
ask:"AI 工具在大学生的学习中越来越普遍。请写一篇文章，谈谈怎样在学习中正确使用 AI 工具。",
steps:["题目问的是「怎样正确使用」，属于对策型议论文，不需要大段讨论 AI 的好坏，开头一两句点出现象就转入正题。","主体用三条对策：把 AI 当助手不当替身；核实 AI 给的信息；控制使用频率。三条分别对应「学习主动性、信息准确性、独立思考」，互不重叠。","每条对策都写「怎么做 + 不这样做的后果」，论证更完整。","开头用 only when… can… 倒装句提出中心观点，是很好的加分句型。","结尾用一句有总结力的话收住，例如强调真正让学习有意义的是自己的思考。"],
paras:[["Nowadays, AI tools have become a common part of college students' study. They can answer questions, polish essays and even write code within seconds. However, only when they are used properly can they truly help us learn.","如今，AI 工具已经成为大学生学习中常见的一部分。它们能在几秒钟内回答问题、润色文章，甚至编写代码。然而，只有正确使用，它们才能真正帮助我们学习。"],
["First, we should treat AI as an assistant rather than a substitute. It is fine to ask AI to explain a difficult concept, but we should still finish our assignments by ourselves, or we will lose the chance to practice.","第一，我们应该把 AI 当作助手，而不是替代品。让 AI 解释一个难懂的概念没问题，但作业仍应该自己完成，否则我们就失去了练习的机会。"],
["Second, we need to check the information that AI provides. AI sometimes gives answers that sound reasonable but are actually wrong, so comparing them with textbooks or reliable websites is necessary.","第二，我们需要核实 AI 提供的信息。AI 有时给出的答案听起来合理，实际上却是错的，所以有必要把它们和教材或可靠的网站进行对照。"],
["Third, it is wise to limit how often we use these tools. Relying on AI for every small question may weaken our ability to think independently.","第三，明智的做法是限制使用这些工具的频率。连每个小问题都依赖 AI，可能会削弱我们独立思考的能力。"],
["In short, AI is a powerful tool, but it is our own thinking that makes learning meaningful.","总之，AI 是一个强大的工具，但真正让学习有意义的，是我们自己的思考。"]],
tips:[["only when… can…","只有……才……，倒装句，加分句型"],["treat A as B rather than C","把 A 当作 B 而不是 C"],["sound reasonable but are actually wrong","听起来合理，实际上是错的"],["think independently","独立思考"],["it is … that …","强调句：真正……的是……"]]},

{type:"翻译",exam:"2026年6月 第一套",title:"中国的餐桌礼仪",
ask:"真题话题：中式餐桌礼仪，涉及待客准备、座次安排、席间照顾客人，以及礼仪的意义。下面是按这个话题原创的练习段落。",
src:"中国人自古重视餐桌礼仪，它是中华传统文化的一部分。请客吃饭时，主人通常会提前了解客人的口味，准备一桌丰盛的饭菜。入座也有讲究，长辈和重要的客人一般坐在最尊贵的位置。用餐时，主人会热情地为客人夹菜、倒茶，客人则要等长辈动筷后再开始吃。这些礼仪体现了中国人热情好客、尊老敬贤的传统，也有助于增进人与人之间的感情。",
steps:["「自古重视」：动作从古代延续到现在，用现在完成时 have valued… since ancient times。","「入座也有讲究」：「讲究」没有对应的英文词，不要硬译，意思是「有规矩」，译成 There are also rules about seating。","「主人会……，客人则要……」：前后是对比关系，用 while 连接两个分句，一句话就能译完。","「动筷」：按字面意思译成 pick up their chopsticks 就很自然。","四字词「热情好客」「尊老敬贤」：抓住核心意思，用名词 hospitality 和 respect for the elderly，比逐字翻译简洁得多。"],
answer:"Chinese people have valued table manners since ancient times, and these manners are part of traditional Chinese culture. When inviting guests to dinner, the host usually finds out about the guests' tastes in advance and prepares a rich meal. There are also rules about seating: the elderly and the most important guests usually take the seats of honor. During the meal, the host warmly serves food and pours tea for the guests, while the guests wait for the elders to pick up their chopsticks before they start eating. These manners reflect the Chinese tradition of hospitality and respect for the elderly, and they also help strengthen relationships between people.",
tips:[["table manners","餐桌礼仪"],["seat of honor","上座、最尊贵的位置"],["in advance","提前"],["hospitality","热情好客"],["strengthen relationships","增进感情"]]},

{type:"翻译",exam:"2025年12月 第一套",title:"城市漫步",
ask:"真题话题：年轻人中流行的「城市漫步」，涉及它和传统打卡旅游的区别、漫步的方式，以及它带来的意义。下面是按这个话题原创的练习段落。",
src:"近年来，“城市漫步”在中国年轻人中流行起来。与传统的打卡式旅游不同，城市漫步不追求去多少景点，而是让人放慢脚步，走进城市的大街小巷。人们可以随意闲逛，也可以沿着某一主题路线探索，品尝地道小吃，欣赏老建筑，感受当地人的日常生活。许多年轻人还用手机记录下沿途的风景。城市漫步让人们更深入地了解一座城市的历史和文化。",
steps:["「近年来……流行起来」：has become popular，现在完成时表示到现在的变化。","「打卡式旅游」：考场上最容易卡住的词。不要直译「打卡」，解释它的意思：只追求多去景点的观光，译成 sightseeing that focuses on visiting as many famous spots as possible。","「不追求……而是……」：用 Unlike…, city walk encourages people to… 把对比放在句首，比 not… but… 更地道。","「品尝、欣赏、感受」一连串动词：用 tasting… admiring… experiencing… 现在分词作伴随状语，挂在主句后面，句子紧凑又不会出错。","「让人们更深入地了解」：enable people to gain a deeper understanding of，是翻译题里非常常用的表达。"],
answer:"In recent years, “city walk” has become popular among young people in China. Unlike traditional sightseeing, which focuses on visiting as many famous spots as possible, city walk encourages people to slow down and explore the streets and lanes of a city. People can wander around freely or follow a route with a particular theme, tasting local snacks, admiring old buildings and experiencing the daily life of local residents. Many young people also record the scenery along the way with their phones. City walk enables people to gain a deeper understanding of a city's history and culture.",
tips:[["streets and lanes","大街小巷"],["wander around","随意闲逛"],["along the way","沿途"],["local residents","当地居民"],["gain a deeper understanding of","更深入地了解"]]},

function others(w,pool){
  const o=shuffle(pool.filter(x=>x[0]!==w[0]&&x[2]!==w[2]));
  if(o.length<3)o.push(...shuffle(D.slice(0,400)).filter(x=>x[0]!==w[0]&&!o.includes(x)).slice(0,3-o.length));
  return o.slice(0,3);
}

function phraseOf(w){
  const re=new RegExp(`\\b${w[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\b`,"i");
  const p=w[3].find(p=>re.test(p[0]));
  return p?[p[0].replace(re,"____"),p[1]]:null;
}

function makeQ(w,pool,type){
  if(type==="ph"){const ph=phraseOf(w);if(ph)return{type,w,text:ph[0],cn:ph[1],opts:shuffle([w,...others(w,pool)])};type="cn"}
  if(type==="sp")return{type,w};
  return{type,w,opts:shuffle([w,...others(w,pool)])};
}

function startPlay(words,lv,review){
  const qs=shuffle(words).map((w,k)=>makeQ(w,words,["en","cn","en","ph","sp"][k%5]));
  P={lv,review:!!review,prog:ST(),words,queue:qs,total:qs.length,done:0,hearts:5,miss:0,combo:0,best:0,ans:null,t0:Date.now()};
  V.tab="play";render();
  buddy("happy",review?"复习错词，答对就从错词本里划掉":"5 颗心，答错会扣一颗，加油！");
}

function optsHTML(q,label){

    const cls=P.ans?(o===q.w?"right":P.ans.pick===k?"wrong":""):"";
    return`<button class="opt ${cls}" data-pick="${k}" ${P.ans?"disabled":""}><kbd>${k+1}</kbd><span>${label(o)}</span></button>`;
  }).join("")}</div>`;
}

function phLine(w){

}

function renderPlay(){
  const q=P.queue[0];
  let body="";
  if(q.type==="en")body=`<p class="qlabel">选出正确的中文意思</p><h2 class="w">${esc(q.w[0])}</h2>${phLine(q.w)}${optsHTML(q,o=>esc(o[2]))}`;
  if(q.type==="cn")body=`<p class="qlabel">哪个单词是这个意思？</p><p class="qcn">${esc(q.w[2])}</p>${optsHTML(q,o=>`<span class="en">${esc(o[0])}</span>`)}`;
  if(q.type==="ph")body=`<p class="qlabel">短语填空：选出空格里的词</p><p class="qph">${esc(q.text).replace("____",`<span class="blank">____</span>`)}</p><p class="sub">${esc(q.cn)}</p>${optsHTML(q,o=>`<span class="en">${esc(o[0])}</span>`)}`;
  if(q.type==="sp")body=`<p class="qlabel">拼写出这个单词（首字母已给出）</p><p class="qcn">${esc(q.w[2])}</p>${phLine(q.w)}
    <form class="spell" id="spf"><input id="spi" aria-label="输入单词" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(q.w[0][0])}${" _".repeat(Math.max(0,q.w[0].length-1))}" value="${P.ans?esc(P.ans.text):""}" ${P.ans?"disabled":""}><button class="btn main" ${P.ans?"disabled":""}>确定</button></form>`;
  const fb=!P.ans?"":`<div class="fb ${P.ans.ok?"ok":"bad"}"><div>${P.ans.ok?`<b>${P.ans.msg}</b><span class="en">${esc(q.w[0])}</span> ${esc(q.w[2])}`:`<b>正确答案</b><span class="en">${esc(q.w[0])}</span> ${esc(q.w[2])}`}</div><button class="btn main" id="p-next">继续</button></div>`;
  $("#view").innerHTML=`

  <div class="combo">${P.combo>=3?`连对 ×${P.combo}`:""}</div>
  <div class="q">${body}</div>${fb}`;
  if(q.type==="sp"&&!P.ans)$("#spi").focus();
  else if(P.ans)$("#p-next").focus({preventScroll:true});
}

function answer(ok,info){
  const q=P.queue[0];
  P.ans=Object.assign({ok,msg:pick(PRAISE)},info);
  if(ok){
    P.combo++;P.best=Math.max(P.best,P.combo);tone(SND.ok);
    if(P.review&&S.wrong[q.w[0]]){delete S.wrong[q.w[0]];save()}
    buddy(P.combo>=5?"dance":"happy",P.combo>=3?`连对 ${P.combo} 题！`:P.ans.msg);
  }else{
    P.combo=0;P.hearts--;P.miss++;
    S.wrong[q.w[0]]=(S.wrong[q.w[0]]||0)+1;save();
    tone(SND.bad);
    buddy("sad",P.hearts?pick(COMFORT):"心用完了……");
  }
  renderPlay();
  if(ok){const tk=q;setTimeout(()=>{if(P&&P.ans&&P.queue[0]===tk)next()},900)}
}

function next(){
  const q=P.queue.shift(),ok=P.ans.ok;
  if(ok)P.done++;
  else P.queue.push(makeQ(q.w,P.words,q.type));
  P.ans=null;
  if(P.hearts<=0)return finish(false);
  if(!P.queue.length)return finish(true);
  renderPlay();
}

function finish(win){
  const stars=win?(P.miss<=1?3:P.miss<=3?2:1):0;
  if(win&&!P.review){P.prog[P.lv]=Math.max(P.prog[P.lv]||0,stars);save()}
  renderStats();
  const sec=Math.round((Date.now()-P.t0)/1000),last=P.lv>=LVN()-1;
  $("#modal").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="crab-big ${win?"dance":"sad"}">${CRAB}</div>
    ${win&&!P.review?`<div class="stars3" aria-label="${stars} 星">${[0,1,2].map(i=>`<span class="s ${i<stars?"on":""}" style="--d:${i*.28}s">★</span>`).join("")}</div>`:""}
    <h2 id="mt" class="fun">${win?(P.review?"错词复习完成！":`第 ${P.lv+1} 关 通关！`):"心用完啦"}</h2>
    <p>${win?`用时 ${fmt(sec)} · 失误 ${P.miss} 次 · 最高连对 ${P.best}`:"别灰心，错的词已经放进错词本，再来一次会更顺。"}</p>
    <div class="row">${win&&!P.review&&!last?`<button class="btn main" id="m-next">下一关</button>`:""}${!win?`<button class="btn main" id="m-retry">再试一次</button>`:""}${win&&!P.review&&stars<3?`<button class="btn" id="m-retry">再刷三星</button>`:""}<button class="btn" id="m-map">回地图</button></div>
  </div>`;
  $("#modal").hidden=false;
  $("#modal .btn").focus();
  if(win){tone(SND.win);confetti();buddy("dance",stars===3?"三颗星！太强了":"通关啦！")}
  else buddy("sad","钳钳陪你再来一次");
}

    <div class="bar-top"><b class="fun" style="font-size:20px">${esc(p.title)}</b><span class="num">点空格，再点下方的词填进去</span></div>
    <div class="passage">${html}</div>
    ${c.checked?"":`<div class="hint-row"><button class="hint-btn" id="cz-hint" ${lv>=2?"disabled":""}>${lv===0?`提示第 ${c.sel+1} 空：要填什么词`:lv===1?`再提示：第 ${c.sel+1} 空的意思`:`第 ${c.sel+1} 空提示已用完`}</button></div>${lv>=1?`<p class="hint">第 ${c.sel+1} 空：${esc(p.g[c.sel])}${lv>=2?`，意思是「${esc(p.m[c.sel])}」`:""}</p>`:""}`}
    <div class="bank">${p.bank.map((w,k)=>`<button class="chip ${used.has(k)?"used":""}" data-bank="${k}" ${c.checked?"disabled":""}><small>${ABC[k]})</small><span class="en">${esc(w)}</span></button>`).join("")}</div>
    ${c.checked?`<p class="fun" style="margin:0;font-size:20px">答对 ${right} / 10 <span class="num">· 用了 ${c.hints} 次提示</span></p><ol class="keys">${p.ans.map((a,i)=>`<li class="${c.fill[i]===a?"":"x"}"><b>${ABC[a]}) ${esc(p.bank[a])}</b> ${esc(p.g[i])}，${esc(p.m[i])}。</li>`).join("")}</ol>`:""}
    <div class="row">${c.checked?`<button class="btn main" id="cz-redo">重做本篇</button>`:`<button class="btn main" id="cz-check" ${used.size<10?"disabled":""}>提交答案</button><button class="btn" id="cz-clear">清空</button>`}</div>
  </div>`;
}

function renderWrong(){
  const ws=Object.entries(S.wrong).filter(([w])=>IDX[w]).sort((a,b)=>b[1]-a[1]);
  if(!ws.length){
    $("#view").innerHTML=`<div class="empty"><div style="width:110px">${CRAB}</div><b class="fun" style="font-size:20px;color:var(--ink)">错词本是空的</b><span>闯关时答错的单词会自动收集到这里，方便集中复习。</span></div>`;
    return;
  }
  $("#view").innerHTML=`<div class="card">
    <div class="bar-top"><b class="fun" style="font-size:20px">${ws.length} 个错词</b><span class="num">按错误次数排序</span></div>
    <div class="row"><button class="btn main" id="w-review">复习前 ${Math.min(20,ws.length)} 个</button><button class="btn" id="w-clear">清空错词本</button></div>
    <div>${ws.map(([w,c])=>`<div class="wrong-row"><span class="en">${esc(w)}</span><span class="num">错 ${c} 次</span><span>${esc(IDX[w][2])}</span></div>`).join("")}</div>
  </div>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.tab){V.tab=d.tab;if(d.tab==="map")V.ch=Math.floor(current()/PERCH);render();buddy("",d.tab==="exam"?"真题精讲里有作文范文和翻译思路":d.tab==="wrong"?"错过的词，多看几眼就记住了":pick(IDLE));return}
  if(d.book){if(S.book!==d.book){S.book=d.book;save();V.ch=Math.floor(current()/PERCH);render();buddy("happy",d.book==="fast"?"极速版：1500 个核心词，冲呀！":"完整版：四级词汇全收录")}return}
  if(d.lv!==undefined){openLevel(+d.lv);return}
  if(d.say!==undefined){speak(d.say);return}
  if(d.pick!==undefined){const q=P.queue[0],k=+d.pick;answer(q.opts[k]===q.w,{pick:k});return}
  if(d.x){X.mode=d.x;renderExam();return}
  if(d.zf){X.zf=d.zf;renderZT();return}
  if(d.zo!==undefined){X.open[d.zo]=!X.open[d.zo];renderZT();return}
  if(d.zc!==undefined){X.cn[d.zc]=!X.cn[d.zc];renderZT();return}
  if(d.zs!==undefined||d.za!==undefined){const k=d.zs??d.za,r=X.rev[k]=X.rev[k]||{};if(d.zs!==undefined)r.s=!r.s;else r.a=!r.a;renderZT();return}
  if(d.vqs!==undefined){X.vq=newVQ(+d.vqs);renderVQ();return}
  if(d.vq!==undefined){
    const s=X.vq,k=+d.vq,q=VQ[s.order[s.i]];s.pick=k;
    if(s.opts[k]===q[1]){s.score++;tone(SND.ok);buddy("happy",pick(PRAISE))}else{tone(SND.bad);buddy("sad","看看句意和解析，下次就会了")}
    if(s.i+1>=s.order.length){S.vqBest[s.set]=Math.max(S.vqBest[s.set]??0,s.score);save()}
    renderVQ();return;
  }
  if(d.czp!==undefined){X.cz=newCZ(+d.czp);renderCZ();return}
  if(d.gap!==undefined){X.cz.sel=+d.gap;renderCZ();return}
  if(d.bank!==undefined){
    const c=X.cz,k=+d.bank,prev=c.fill.indexOf(k);
    if(prev>-1)c.fill[prev]=null;
    c.fill[c.sel]=k;
    const nx=c.fill.findIndex(f=>f===null);
    if(nx>-1)c.sel=nx;
    renderCZ();return;
  }
  switch(t.id){
    case "mute":S.mute=!S.mute;save();renderStats();break;
    case "ch-prev":V.ch=Math.max(0,V.ch-1);renderMap();break;
    case "ch-next":V.ch=Math.min(CHNN()-1,V.ch+1);renderMap();break;
    case "to-map":V.tab="map";render();break;
    case "l-prev":L.i--;renderLearn();break;
    case "l-next":L.i=(L.i+1)%lvWords(L.lv).length;renderLearn();break;
    case "go-play":startPlay(lvWords(L.lv),L.lv);break;
    case "p-next":next();break;
    case "p-quit":P=null;V.tab="map";render();buddy("","下次接着来");break;
    case "m-next":closeModal();openLevel(P.lv+1);break;
    case "m-retry":closeModal();startPlay(P.words,P.lv,P.review);break;
    case "m-map":closeModal();V.tab=P.review?"wrong":"map";V.ch=Math.floor(current()/PERCH);P=null;render();break;
    case "vq-sets":X.vq=null;renderVQ();break;
    case "vq-hint":{const s=X.vq,q=VQ[s.order[s.i]];s.hint++;s.hints++;if(s.hint===2)s.out=shuffle(s.opts.map((o,k)=>o===q[1]?-1:k).filter(k=>k>-1)).slice(0,2);renderVQ();break}
    case "vq-next":{const s=X.vq;s.i++;s.pick=null;s.opts=null;s.hint=0;s.out=[];renderVQ();if(s.i>=s.order.length&&s.score>=8){tone(SND.win);confetti();buddy("dance",`${s.score} 分！太稳了`)}break}
    case "cz-hint":{const c=X.cz;c.hint[c.sel]=(c.hint[c.sel]||0)+1;c.hints++;renderCZ();break}
    case "cz-check":{X.cz.checked=true;const p=CLOZE[X.cz.p],r=X.cz.fill.filter((f,i)=>f===p.ans[i]).length;renderCZ();if(r>=8){tone(SND.win);confetti();buddy("dance",`对了 ${r} 个，厉害！`)}else buddy("happy",`对了 ${r} 个，看看下面的解析`);break}
    case "cz-clear":case "cz-redo":X.cz=newCZ(X.cz.p);renderCZ();break;
    case "w-review":startPlay(Object.entries(S.wrong).filter(([w])=>IDX[w]).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([w])=>IDX[w]),-1,true);break;
    case "w-clear":
      if(t.dataset.armed){S.wrong={};save();render()}
      else{t.dataset.armed="1";t.textContent="再点一次确认清空"}
      break;
  }
});

document.addEventListener("input",e=>{
  if(e.target.dataset.zd!==undefined)X.draft[e.target.dataset.zd]=e.target.value;
});

document.addEventListener("submit",e=>{
  if(e.target.id!=="spf")return;
  e.preventDefault();
  const q=P.queue[0],v=$("#spi").value.trim();
  if(!v)return;
  answer(v.toLowerCase()===q.w[0].toLowerCase(),{text:v});
});

document.addEventListener("keydown",e=>{
  if(!$("#modal").hidden)return;
  const typing=/INPUT|TEXTAREA/.test(e.target.tagName);
  if(V.tab==="play"&&P){
    if(!P.ans&&!typing&&/^[1-4]$/.test(e.key)&&P.queue[0].opts){const b=document.querySelector(`[data-pick="${+e.key-1}"]`);if(b)b.click()}
    else if(P.ans&&e.key==="Enter"){e.preventDefault();next()}
  }else if(V.tab==="learn"&&!typing){
    if(e.key==="ArrowRight")$("#l-next").click();
    else if(e.key==="ArrowLeft"&&L.i>0)$("#l-prev").click();
  }
});

addEventListener("resize",drawTrail);
$("#buddy").innerHTML=CRAB;
render();
</script>

</body>
</html>
